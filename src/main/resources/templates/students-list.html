<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Студенты</title>
</head>
<body>
<h1>Список студентов</h1>
<table border="1">
    <tr>
        <th>ID</th>
        <th>Имя</th>
        <th>Курс</th>
        <th>Задолженность</th>
    </tr>
    <tr th:each="s : ${students}">
        <td th:text="${s.id}"></td>
        <td th:text="${s.name}"></td>
        <td th:text="${s.course}"></td>
        <td th:text="${s.hasDebt} ? 'Да' : 'Нет'"></td>
    </tr>
</table>
<a th:href="@{/students/add}">Добавить студента</a> |
<a th:href="@{/logout}">Выйти</a>
</body>
</html>
